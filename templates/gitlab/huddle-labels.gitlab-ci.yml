# Huddle: keeps the status labels of the Issues up to date from each «Depends on» section.
# Copied by `huddle-setup`; add `include: local: huddle-labels.gitlab-ci.yml` to .gitlab-ci.yml.
#
# GitLab CI does not react to Issue events, so this job runs on a pipeline schedule (and on an MR pipeline in the `events` mode,
# or on a manual run in the `hourly` mode: see `labels_job` in huddle.json, docs/design.md §23).
# GitLab has no CI trigger for comments, so after a comment or after a push the label can take up to 10 minutes to change
# (up to an hour in the `hourly` mode): the schedule is what updates the labels.
# The interval is a project setting on GitLab, not in this file. Set it in CI/CD > Schedules, on the default branch:
# the cron `17 * * * *` for `hourly` (the default), and `*/10 * * * *` for `events`.
#
# It needs a token: the job token cannot edit Issues. The AI Manager creates a project access token with the `api` scope
# and stores it as the CI variable HUDDLE_TOKEN (masked and protected). This file only reads the variable; the job
# never prints it and never turns on shell tracing.
#
# A protected variable is empty in pipelines of unprotected refs (most MR pipelines). There the job ends green with one
# line and changes nothing. On a schedule or on a protected ref a missing token still fails.

huddle-labels:
  # A normal stage, not .pre/.post: GitLab treats a pipeline with only .pre/.post jobs as empty and never runs it, and a
  # project with no other CI has only this job. `test` is one of the default stages, so it always exists.
  stage: test
  image: node:24
  variables:
    # Which version of Huddle to run (a release tag or a full commit SHA to pin it) and which glab to install.
    HUDDLE_REF: main
    GLAB_VERSION: "1.50.0"
    GIT_DEPTH: "1"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  resource_group: huddle-labels
  script:
    - |
      if [ -z "$HUDDLE_TOKEN" ]; then
        if [ "$CI_PIPELINE_SOURCE" != "schedule" ] && [ "$CI_COMMIT_REF_PROTECTED" != "true" ]; then
          echo "Huddle: HUDDLE_TOKEN is only available on protected branches; the schedule on the default branch updates the labels."
          exit 0
        fi
        echo "HUDDLE_TOKEN is not set: the AI Manager must add it as a masked, protected CI variable." >&2
        exit 1
      fi
    - export GITLAB_TOKEN="$HUDDLE_TOKEN"
    - export GITLAB_HOST="$CI_SERVER_FQDN"
    - curl -fsSL -o /tmp/glab.deb "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION}/downloads/glab_${GLAB_VERSION}_linux_amd64.deb"
    - dpkg -i /tmp/glab.deb
    - git clone --quiet https://github.com/SrProfessional/Huddle.git /tmp/huddle
    - git -C /tmp/huddle checkout --quiet "$HUDDLE_REF"
    - node /tmp/huddle/bin/huddle labels
